# Optional .env for local dev (gitignored). On Render, set the same keys as environment variables.
spring.config.import=optional:file:.env[.properties]

spring.application.name=estatehub-backend

# Database - local default is MySQL; set DB_URL to a Supabase PostgreSQL URL for production.
# Supabase: Project Settings -> Database -> Connection string (Direct connection):
#   jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/estatehubDb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root200419}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# File upload
app.upload-dir=${UPLOAD_DIR:${user.home}/estatehub-uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# JWT - must override JWT_SECRET in production (Render env vars)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:36000000}

# Comma-separated list of allowed frontend origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}